<!-- frontend/scripts/brand/preview-icons.template.html — nguồn cho preview-icons.html (sinh bằng `pnpm brand:icons`, mở trực tiếp bằng browser, không ship) -->
<!doctype html><meta charset="utf-8" /><title>Icon preview</title>
<style>
  body {
    font-family: sans-serif;
    margin: 24px;
    display: grid;
    gap: 24px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(10, 64px);
    gap: 12px;
    padding: 16px;
    border-radius: 12px;
  }
  .light {
    background: #fbf6ea;
    color: #0a2e26;
  }
  .dark {
    background: #0a2e26;
    color: #fbf6ea;
  }
  figure {
    margin: 0;
    text-align: center;
  }
  img {
    width: 32px;
    height: 32px;
  }
  figcaption {
    font-size: 9px;
  }
</style>
<div id="root"></div>
<div class="row light" id="mascot-light"></div>
<div class="row dark" id="mascot-dark"></div>
<label
  >--rangi-glow
  <input
    type="range"
    min="0"
    max="1"
    step="0.05"
    value="1"
    oninput="
      document
        .querySelectorAll('.mascot-obj')
        .forEach((o) =>
          o.contentDocument?.documentElement.style.setProperty('--rangi-glow', this.value),
        )
    "
/></label>
<script>
  for (const mode of ["light", "dark"]) {
    document.getElementById(`mascot-${mode}`).innerHTML = [
      "firefly-glowing",
      "firefly-resting",
      "firefly-greeting",
    ]
      .map(
        (n) =>
          `<figure><object class="mascot-obj" data="../../public/brand/mascot/${n}.svg" type="image/svg+xml" style="width:96px;height:96px"></object><figcaption>${n}</figcaption></figure>`,
      )
      .join("");
  }
</script>
<script>
  const GROUPS = /*__GROUPS__*/;
  for (const mode of ["light", "dark"])
    for (const set of ["outline", "filled"])
      for (const [group, names] of Object.entries(GROUPS)) {
        const h = document.createElement("h3");
        h.textContent = `${group} — ${mode}/${set}`;
        document.getElementById("root").appendChild(h);
        const d = document.createElement("div");
        d.className = `row ${mode}`;
        d.innerHTML = names
          .map(
            (n) =>
              `<figure><img src="../../public/brand/icons/${set}/${n}.svg" onerror="this.style.opacity=.15"><figcaption>${n}</figcaption></figure>`,
          )
          .join("");
        document.getElementById("root").appendChild(d);
      }
</script>
