    <mask id="wingcut-fl-glowing" maskUnits="userSpaceOnUse" x="0" y="0" width="220" height="252"><rect width="220" height="252" fill="#fff"/><g filter="url(#cutsoft-fl-glowing)"><path d="M110 97 C102.5 98 97 104 95.8 117 C94.4 142 98 179 110 179 C122 179 125.6 142 124.2 117 C123 104 117.5 98 110 97 Z" fill="#000" stroke="#000" stroke-width="8" stroke-linejoin="round"/><circle cx="110" cy="76.5" r="19.7" fill="#000"/></g></mask>
