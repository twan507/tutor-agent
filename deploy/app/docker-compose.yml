services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    networks:
      - tutor-net

  celery-worker:
    build:
      context: ../../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file: ../../.env
    networks:
      - tutor-net

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    restart: unless-stopped
    networks:
      - tutor-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - tutor-net

networks:
  tutor-net:
    external: true
